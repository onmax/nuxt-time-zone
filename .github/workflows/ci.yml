name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-pnpm
      # Generates .nuxt types for the module and the playground
      - run: pnpm dev:prepare
      # Format, lint and type-aware lint (Oxfmt, Oxlint); the lint reads the .nuxt tsconfigs
      - run: vp check
      - run: pnpm typecheck
      # Strict Vite Doctor, defined as a task in vite.config.ts
      - run: vp run check:doctor
      # Builds dist and checks the packed package with publint
      - run: pnpm validate
      # The release publishes this verified build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - run: pnpm build:playground
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      # Scenario 13 again, against nuxi dev
      - run: pnpm test:e2e:dev
