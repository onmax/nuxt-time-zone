trustPolicy: no-downgrade
trustPolicyExclude:
  # newer semver majors carry provenance, 6.x never did; @babel/core (via nuxt) depends on it
  - semver@6.3.1
  # 0.1.1+ carry GitHub Actions provenance but no trusted-publisher record, which 0.1.0 had
  - vite-doctor@0.1.3
  # same for the TypeScript 7 port that vite-plus pins for type-aware lint
  - tsrs@7.1.0-beta.tsrs2

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # libvips comes prebuilt in sharp's platform package; the install script only falls back to a source build.
  sharp: true
  unrs-resolver: false
  vue-demi: false

catalogs:
  brand:
    sharp: ^0.35.5
  build:
    '@nuxt/module-builder': ^1.0.3
    '@types/node': ^24.19.2
    publint: ^0.3.25
    typescript: ^6.0.3
    vue-tsc: ^3.3.14
  lint:
    vite-doctor: ^0.1.3
    vite-plus: ^1.7.0
  nuxt:
    nuxt: ^4.6.3
    vue: ^3.5.44
    vue-router: ^5.4.0
  prod:
    '@nuxt/kit': ^4.6.3
    h3: ^1.15.11
  test:
    '@playwright/test': ^1.64.1
